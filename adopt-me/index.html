<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>olvr's marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <div class="page-wrap landing">

    <nav>
      <span class="nav-logo">olvr<span>'s marketplace</span></span>
      <div class="nav-right">
        <a href="#" id="nav-tiktok" class="tiktok-btn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.84 1.55V6.89a4.85 4.85 0 01-1.07-.2z"/></svg>
          TikTok
        </a>
      </div>
    </nav>

    <section class="hero">

      <div class="hero-left">
        <span class="hero-eyebrow">Adopt Me Trading</span>
        <h1 class="hero-slogan">Grow Your Inventory</h1>
        <div class="hero-actions">
          <a href="shop.html" class="btn btn-primary">Browse Pets</a>
          <a href="#" id="hero-tiktok" class="tiktok-btn" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.84 1.55V6.89a4.85 4.85 0 01-1.07-.2z"/></svg>
            DM on TikTok
          </a>
        </div>
        <p class="hero-desc">Browse available pets by rarity and price. When you find what you want, send a DM on TikTok to negotiate and arrange your trade. No auctions, no third parties.</p>
      </div>

      <div class="hero-right" id="hero-right"></div>

    </section>

  </div>

  <script src="data.js"></script>
  <script>
    const s = getSettings();
    const ttUrl = 'https://www.tiktok.com/@' + s.tiktokUsername;
    document.getElementById('nav-tiktok').href  = ttUrl;
    document.getElementById('hero-tiktok').href = ttUrl;
    document.title = s.shopName;

    const withImages = getPets().filter(p => p.visible !== false && p.image);
    const featured = withImages.sort((a, b) => b.price - a.price)[0] || null;
    const right = document.getElementById('hero-right');

    if (featured) {
      right.innerHTML = `<img class="hero-featured-img" src="${featured.image}" alt="${featured.name}">`;
    } else {
      right.innerHTML = `<p class="hero-right-empty">Upload pet images via the admin panel to feature them here.</p>`;
    }
  </script>
</body>
</html>
