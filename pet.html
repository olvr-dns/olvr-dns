<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/jpeg" href="favicon.jpg">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet — olvr's marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="page-wrap pet-wrap">

    <nav>
      <a href="index.html" class="nav-logo">olvr<span>'s marketplace</span></a>
      <div class="nav-right">
        <a href="#" id="nav-tiktok" class="tiktok-btn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.84 1.55V6.89a4.85 4.85 0 01-1.07-.2z"/></svg>
          DM on TikTok
        </a>
      </div>
    </nav>

    <div class="pet-detail" id="pet-detail">
      <div class="pet-detail-img-side" id="img-side"></div>
      <div class="pet-detail-content">
        <a href="shop.html" class="pet-detail-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to listings
        </a>
        <div class="pet-detail-badges" id="detail-badges"></div>
        <h1 class="pet-detail-name" id="detail-name"></h1>
        <div class="pet-detail-price" id="detail-price"></div>
        <div class="pet-detail-meta">
          <div class="meta-block">
            <div class="meta-label">Available</div>
            <div class="meta-value" id="detail-qty"></div>
          </div>
          <div class="meta-block">
            <div class="meta-label">Rarity</div>
            <div class="meta-value" id="detail-rarity"></div>
          </div>
        </div>
        <div class="addons-section">
          <div class="addons-section-label">Addons</div>
          <div class="addons-row" id="detail-addons"></div>
        </div>
        <a href="#" id="detail-tiktok" class="pet-detail-tiktok" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.84 1.55V6.89a4.85 4.85 0 01-1.07-.2z"/></svg>
          Message me on TikTok to negotiate
        </a>
        <p class="pet-detail-note">No in-site purchasing — all trades arranged via TikTok DM</p>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    const cfg = getSettings();
    const cur = cfg.currency || '$';
    const ttUrl = 'https://www.tiktok.com/@' + cfg.tiktokUsername;
    document.getElementById('nav-tiktok').href  = ttUrl;
    document.getElementById('detail-tiktok').href = ttUrl;

    const RARITY_LABEL = { legendary: 'Legendary', 'ultra-rare': 'Ultra-Rare', rare: 'Rare', uncommon: 'Uncommon', common: 'Common' };

    const ADDON_MAP = {
      Normal: [],
      R:   ['Ride'],
      FR:  ['Fly', 'Ride'],
      NFR: ['Neon', 'Fly', 'Ride'],
      MFR: ['Mega', 'Neon', 'Fly', 'Ride'],
    };
    const ALL_ADDONS = ['Fly', 'Ride', 'Neon', 'Mega'];

    const RARITY_PH = {
      legendary:   'rgba(253,230,138,0.4)',
      'ultra-rare':'rgba(221,214,254,0.4)',
      rare:        'rgba(191,219,254,0.4)',
      uncommon:    'rgba(167,243,208,0.4)',
      common:      'rgba(226,232,240,0.4)',
    };

    const id  = parseInt(new URLSearchParams(location.search).get('id'));
    const pet = getPets().find(p => p.id === id);

    if (!pet) {
      location.href = 'shop.html';
    } else {
      document.title = pet.name + " — olvr's marketplace";

      const imgSide = document.getElementById('img-side');
      if (pet.image) {
        imgSide.innerHTML = `<img src="${pet.image}" alt="${pet.name}">`;
      } else {
        const bg = RARITY_PH[pet.rarity] || 'rgba(226,232,240,0.4)';
        imgSide.innerHTML = `<div class="pet-detail-img-placeholder" style="background:${bg}">${pet.name.charAt(0).toUpperCase()}</div>`;
      }

      const varLabel = { Normal:'Normal', R:'Ride', FR:'Fly Ride', NFR:'Neon FR', MFR:'Mega NFR' }[pet.variant] || pet.variant;
      const showVar  = pet.variant && pet.variant !== 'Normal';
      document.getElementById('detail-badges').innerHTML = `
        <span class="badge badge-${pet.rarity}">${RARITY_LABEL[pet.rarity] || pet.rarity}</span>
        ${showVar ? `<span class="badge badge-variant">${varLabel}</span>` : ''}`;

      document.getElementById('detail-name').textContent  = pet.name;
      document.getElementById('detail-price').textContent = cur + Number(pet.price).toLocaleString();
      document.getElementById('detail-qty').textContent   = pet.quantity > 0 ? pet.quantity : 'Sold out';
      document.getElementById('detail-rarity').textContent = RARITY_LABEL[pet.rarity] || pet.rarity;

      const active = ADDON_MAP[pet.variant] || [];
      document.getElementById('detail-addons').innerHTML = ALL_ADDONS.map(a =>
        `<span class="addon-pill ${active.includes(a) ? 'on' : 'off'}">${a}</span>`
      ).join('');
    }
  </script>
</body>
</html>
