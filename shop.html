<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/jpeg" href="favicon.jpg">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse — olvr's marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="page-wrap shop-wrap">

    <nav>
      <a href="index.html" class="nav-logo">olvr<span>'s marketplace</span></a>
      <div class="nav-right">
        <a href="#" id="nav-tiktok" class="tiktok-btn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.84 1.55V6.89a4.85 4.85 0 01-1.07-.2z"/></svg>
          DM on TikTok
        </a>
      </div>
    </nav>

    <div class="shop-hero">
      <h1 class="shop-title-line">Browse <span>all pets</span></h1>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-bar" id="search" placeholder="Search pets...">
      </div>
      <select class="sort-select" id="sort">
        <option value="default">Default order</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="qty-desc">Most available</option>
        <option value="name-asc">Name A–Z</option>
      </select>
    </div>

    <div class="filters" id="filters"></div>

    <div class="pets-grid" id="pets-grid"></div>

  </div>

  <!-- Footer admin link -->
  <footer style="position:relative;z-index:2;text-align:center;padding:20px 0 32px">
    <a href="admin.html" style="font-size:0.72rem;font-weight:300;color:rgba(28,24,40,0.18);letter-spacing:0.06em;transition:color 0.2s"
       onmouseover="this.style.color='rgba(28,24,40,0.45)'" onmouseout="this.style.color='rgba(28,24,40,0.18)'">
      admin
    </a>
  </footer>

  <script src="data.js"></script>
  <script>
    const cfg = getSettings();
    const cur = cfg.currency || '$';
    document.getElementById('nav-tiktok').href = 'https://www.tiktok.com/@' + cfg.tiktokUsername;

    const RARITY_ORDER = { legendary: 0, 'ultra-rare': 1, rare: 2, uncommon: 3, common: 4 };
    const RARITY_LABEL = { legendary: 'Legendary', 'ultra-rare': 'Ultra-Rare', rare: 'Rare', uncommon: 'Uncommon', common: 'Common' };

    let activeRarity = 'all';
    let query = '';
    let sortMode = 'default';

    function allVisible() { return getPets().filter(p => p.visible !== false); }

    function buildFilters(pets) {
      const counts = {};
      pets.forEach(p => { counts[p.rarity] = (counts[p.rarity]||0)+1; });
      const rarities = ['legendary','ultra-rare','rare','uncommon','common'].filter(r => counts[r]);
      document.getElementById('filters').innerHTML = `
        <button class="filter-pill ${activeRarity==='all'?'active':''}" data-rarity="all">
          All <span class="pill-count">${pets.length}</span>
        </button>
        ${rarities.map(r => `
          <button class="filter-pill ${activeRarity===r?'active':''}" data-rarity="${r}">
            ${RARITY_LABEL[r]} <span class="pill-count">${counts[r]}</span>
          </button>`).join('')}`;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.onclick = () => { activeRarity = btn.dataset.rarity; render(); };
      });
    }

    function sortPets(list) {
      const copy = [...list];
      if (sortMode === 'price-asc')  return copy.sort((a,b) => a.price - b.price);
      if (sortMode === 'price-desc') return copy.sort((a,b) => b.price - a.price);
      if (sortMode === 'qty-desc')   return copy.sort((a,b) => b.quantity - a.quantity);
      if (sortMode === 'name-asc')   return copy.sort((a,b) => a.name.localeCompare(b.name));
      return copy.sort((a,b) => (RARITY_ORDER[a.rarity]??5) - (RARITY_ORDER[b.rarity]??5));
    }

    function render() {
      const all = allVisible();
      buildFilters(all);
      let list = all.filter(p => {
        const mR = activeRarity === 'all' || p.rarity === activeRarity;
        const mQ = !query || p.name.toLowerCase().includes(query.toLowerCase());
        return mR && mQ;
      });
      list = sortPets(list);

      const grid = document.getElementById('pets-grid');
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state"><h3>No pets found</h3><p>Try a different filter or search</p></div>`;
        return;
      }

      grid.innerHTML = list.map((pet, i) => {
        const imgHtml = pet.image
          ? `<img class="card-img-full" src="${pet.image}" alt="${pet.name}" loading="lazy">`
          : `<div class="card-placeholder-full rarity-ph-${pet.rarity}"><span class="card-placeholder-letter">${pet.name.charAt(0)}</span></div>`;
        return `
          <div class="pet-card ${pet.quantity===0?'sold-out':''}"
               data-rarity="${pet.rarity}"
               style="animation-delay:${i*0.04}s"
               onclick="location.href='pet.html?id=${pet.id}'">
            ${pet.quantity===0?'<span class="sold-out-tag">Sold Out</span>':''}
            ${imgHtml}
            <div class="card-info">
              <div class="card-name">${pet.name}</div>
              <span class="card-sep">—</span>
              <div class="card-price">${cur}${Number(pet.price).toLocaleString()}</div>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('search').oninput = e => { query = e.target.value; render(); };
    document.getElementById('sort').onchange  = e => { sortMode = e.target.value; render(); };
    render();
  </script>
</body>
</html>
